[package]
name = "playground"
version = "0.1.0"
edition = "2024"

[dependencies]
avian3d = "0.7.0"
bevy = "0.19.0"
bevy-tnua = "0.32.0"
bevy-tnua-avian3d = "0.12.0"
bevy_enhanced_input = "0.26.0"
chrono = "0.4.45"
rand = "0.9.5"

# Enable a small amount of optimization in debug mode
[profile.dev]
opt-level = 1

# Enable high optimizations for dependencies (incl. Bevy), but not for our code:
[profile.dev.package."*"]
opt-level = 3
